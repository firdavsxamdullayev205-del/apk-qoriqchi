name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o ./apk-qoriqchi*.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
          build-root-directory: src/apk-qoriqchi
      - run: gradle assembleDebug
        working-directory: src/apk-qoriqchi
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Qoriqchi
          path: src/apk-qoriqchi/app/build/outputs/apk/debug/app-debug.apk
